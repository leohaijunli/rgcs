# cargo-deny configuration (ADR-007: CI must check dependency licenses).
#
# MagGCS itself has no license yet (ADR-007 is still Draft), so the license
# allow-list governs *dependencies*: it rejects copyleft/unknown licenses that
# would constrain distribution alongside QGC (GPLv3) and commercial payload
# software. Workspace members are `publish = false`, so they are ignored.

[graph]
# Target platforms we ship desktop builds for.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
# quick-xml is pulled in only by `mavlink-bindgen` (a build-time dependency)
# and is pinned to `0.39` by mavlink 0.17.1, so it cannot be upgraded yet. The
# bindgen only parses the bundled MAVLink dialect XML — trusted, in-tree input,
# never untrusted XML — so the DoS vectors below are not reachable here.
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "build-time mavlink-bindgen parses only trusted dialect XML" },
  { id = "RUSTSEC-2026-0195", reason = "build-time mavlink-bindgen parses only trusted dialect XML" },
]
yanked = "deny"
# Flag unmaintained crates (does not fail the build).
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
