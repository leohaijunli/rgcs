name: ci

on:
  # Release builds only: pushing a `v*` tag runs the checks and produces the
  # Windows and Ubuntu installers. The SITL heartbeat integration job is
  # cancelled.
  push:
    tags: ["v*"]

jobs:
  rust-check:
    name: Rust check / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      # `tauri::generate_context!` requires frontendDist to exist, and it is
      # gitignored; build the frontend first so cargo clippy/test can compile
      # maggcs-app.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Check compiled MAVLink stream catalog metadata
        run: python3 scripts/generate-stream-catalog.py --check
      # The terrain discovery test needs the regular helper executable next
      # to the test binaries; cargo test builds a test harness for the bin.
      - name: Build DEM helper for terrain discovery tests
        run: cargo build -p dem-prep --bin dem-prep
      - run: cargo test --all-targets
      # ADR-002: committed ts-rs bindings must match regeneration.
      - name: Check ts-rs bindings are in sync
        run: |
          npm --prefix frontend run check:generated-types
          if ! git diff --exit-code -- crates/core/bindings crates/app-tauri/bindings frontend/src/generated-types; then
            echo "::error::Generated Rust/TypeScript contracts are stale. Regenerate core and native export_bindings and the frontend mirror."
            exit 1
          fi

  deny:
    name: Dependency & license check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ADR-007: CI must check dependency licenses (config in deny.toml).
      # Pinned so the deny.toml schema matches what was validated locally.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  frontend:
    name: Frontend typecheck / build / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        # Runtime deps only: devDependencies (vite plugins) are build tools and
        # carry advisories that do not ship to users.
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run check:generated-types
      - run: bash scripts/check-colors.sh
      - run: npm run check:contrast
      # 0.6: every t('...') key must exist, so the UI never shows raw keys.
      - run: npm run check:i18n
      # Pure-module guards: .plan interop, upload/download state machine,
      # coordinate entry, the AGL ground reference and the flight-progress
      # maths.
      - run: npm run check:planfile
      - run: npm run check:mission-sync
      - run: npm run check:undo
      - run: npm run check:survey-prep
      - run: npm run check:surface
      - run: npm run check:plan-steps
      - run: npm run check:coords
      - run: npm run check:agl
      - run: npm run check:progress
      - run: npm run check:polygon
      - run: npm run check:drape-error
      - run: npm run check:plan-profile
      - run: npm run build

  windows-build:
    name: Build Windows installer (NSIS/MSI)
    needs: [rust-check, deny, frontend]
    # A failed check must remain visible, but must not silently skip the
    # requested installer build. Artifacts still go to a draft release.
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Bundle Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/app-tauri
          args: '--bundles nsis,msi'
          # The workflow only runs on a version tag, so always publish a
          # release draft with the installer as an asset.
          tagName: ${{ github.ref_name }}
          releaseName: ${{ format('Q-Mag {0}', github.ref_name) }}
          releaseBody: |
            Windows: download the NSIS setup.exe or MSI installer.
            Ubuntu: use the deb package; AppImage is the larger portable option.
            Windows installers are currently unsigned and may show publisher/reputation warnings.
            See docs/RELEASES.md for installer formats and Windows verification steps.
          releaseDraft: true
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: maggcs-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          # A build that silently produced no installer is useless.
          if-no-files-found: error

  ubuntu-build:
    name: Build Ubuntu installer (AppImage/deb)
    needs: [rust-check, deny, frontend]
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Bundle Ubuntu installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/app-tauri
          args: '--bundles appimage,deb'
          # The workflow only runs on a version tag: publish into the same
          # draft release the Windows job created (tauri-action appends to an
          # existing release for the tag).
          tagName: ${{ github.ref_name }}
          releaseName: ${{ format('Q-Mag {0}', github.ref_name) }}
          releaseBody: |
            Windows: download the NSIS setup.exe or MSI installer.
            Ubuntu: use the deb package; AppImage is the larger portable option.
            Windows installers are currently unsigned and may show publisher/reputation warnings.
            See docs/RELEASES.md for installer formats and Windows verification steps.
          releaseDraft: true
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: maggcs-ubuntu
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          # A build that silently produced no installer is useless.
          if-no-files-found: error
