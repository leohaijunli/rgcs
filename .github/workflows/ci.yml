name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly Monday 04:00 UTC: long SITL acceptance

jobs:
  rust-check:
    name: Rust check / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # ADR-002: committed ts-rs bindings must match regeneration.
      - name: Check ts-rs bindings are in sync
        run: |
          if ! git diff --exit-code -- crates/core/bindings; then
            echo "::error::Generated ts-rs bindings are stale. Run 'cargo test -p maggcs-core', then commit crates/core/bindings."
            exit 1
          fi

  deny:
    name: Dependency & license check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ADR-007: CI must check dependency licenses (config in deny.toml).
      # Pinned so the deny.toml schema matches what was validated locally.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  frontend:
    name: Frontend typecheck / build / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        # Runtime deps only: devDependencies (vite plugins) are build tools and
        # carry advisories that do not ship to users.
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: bash scripts/check-colors.sh
      - run: npm run check:contrast
      - run: npm run build

  windows-build:
    name: Build Windows installer (NSIS/MSI)
    runs-on: windows-latest
    # Only build a release when a version tag is pushed (or on manual dispatch).
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Bundle Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/app-tauri
          args: ''
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          releaseName: ${{ github.ref_type == 'tag' && format('MagGCS {0}', github.ref_name) || 'MagGCS v0.1.0' }}
          releaseBody: 'Windows installer (NSIS/MSI). See assets to download.'
          releaseDraft: true
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: maggcs-windows
          path: target/release/bundle/**
          if-no-files-found: warn

  sitl:
    name: PX4 SITL heartbeat integration
    runs-on: ubuntu-latest
    # Long-running SITL: schedule/manual only (not on every push).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2

      - name: Clone PX4-Autopilot (pinned to the documented dev version)
        run: |
          git clone --recursive --depth 1 --branch v1.17.0 \
            https://github.com/PX4/PX4-Autopilot.git "$HOME/PX4-Autopilot"

      - name: Build MagGCS monitor
        run: cargo build --release --example sitl_monitor

      - name: Run SITL heartbeat smoke test (120 s)
        env:
          SITL_DURATION: "120"
        run: |
          docker run --rm -d --name px4-sitl \
            -v "$HOME/PX4-Autopilot:/px4" \
            -p 14550:14550/udp \
            px4io/px4-dev-simulation-focal:latest \
            bash -c "cd /px4 && make px4_sitl && HEADLESS=1 make px4_sitl jmavsim"
          sleep 120
          timeout $((SITL_DURATION + 120)) ./target/release/examples/sitl_monitor \
            udpin:0.0.0.0:14550 "$SITL_DURATION" 3 1
          RC=$?
          docker rm -f px4-sitl >/dev/null 2>&1 || true
          exit $RC
