<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Q-Mag Survey workspace — engineering layout concept</title>
  <desc id="desc">A two-row navigation system, stable aircraft status and commands, a collapsible route outline, a central survey map, a contextual inspector and a linked terrain profile. This is a static design illustration with schematic geometry and illustrative values, awaiting owner review.</desc>
  <defs>
    <style>
      svg{--mg-bg:#0b1220;--mg-bg-raised:#111b2e;--mg-border:#22314d;--mg-ink:#dbe4f5;--mg-muted:#8aa0c4;--mg-accent:#22d3ee;--mg-ok:#22c55e;--mg-warn:#eab308;--mg-error:#ef4444;--mg-mag:#c084fc;font-family:Inter,Arial,sans-serif;background:var(--mg-bg)}
      text{fill:var(--mg-ink);font-size:14px} .muted{fill:var(--mg-muted)} .small{font-size:12px} .mono{font-family:"JetBrains Mono",Consolas,monospace;font-variant-numeric:tabular-nums} .title{font-size:18px;font-weight:600} .bold{font-weight:600} .eyebrow{font-size:11px;letter-spacing:1.3px;fill:var(--mg-muted)}
      .bg{fill:var(--mg-bg)} .panel{fill:var(--mg-bg-raised)} .edge{stroke:var(--mg-border);stroke-width:1} .input{fill:var(--mg-bg);stroke:var(--mg-border);stroke-width:1} .accent{fill:var(--mg-accent)} .ok{fill:var(--mg-ok)} .warn{fill:var(--mg-warn)} .error{fill:var(--mg-error)} .mag{fill:var(--mg-mag)}
      .contour{fill:none;stroke:var(--mg-muted);stroke-width:1;opacity:.12} .survey{fill:none;stroke:var(--mg-accent);stroke-width:2;opacity:.58} .transit{fill:none;stroke:var(--mg-muted);stroke-width:2;stroke-dasharray:6 5} .tie{fill:none;stroke:var(--mg-warn);stroke-width:2;stroke-dasharray:9 4}
    </style>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#22314d" stroke-width=".6" opacity=".32"/></pattern>
    <clipPath id="aoi"><path d="M354 236L837 193L1001 475L477 555L332 386Z"/></clipPath>
  </defs>
