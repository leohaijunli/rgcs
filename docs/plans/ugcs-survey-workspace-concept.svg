  <text x="152" y="33">Saanich project</text><text x="270" y="33" class="muted">⌄</text>
  <text x="411" y="33" class="small muted">CONCEPT · AWAITING REVIEW</text>
  <circle cx="653" cy="28" r="3.5" class="ok"/><text x="665" y="33" class="small">PX4 · connected</text>
  <text x="787" y="33" class="small muted">DISARMED</text>
  <text x="889" y="33" class="small">Mode: Hold ⌄</text>
  <circle cx="1005" cy="28" r="3.5" class="ok"/><text x="1017" y="33" class="small">RTK FIX</text>
  <text x="1099" y="33" class="mono bold">87%</text>
  <rect x="1152" y="12" width="54" height="32" rx="4" class="input"/><text x="1165" y="33" class="small">Hold</text>
