[package]
name = "maggcs-app"
description = "Q-Mag desktop ground control station (Tauri 2)"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "maggcs_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
maggcs-core = { path = "../core" }
mavlink.workspace = true
parking_lot = "0.12"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ts-rs.workspace = true
# A10: rolling file log + panic hook; the tracing-appender does the rotation.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tauri = { version = "2" }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }
